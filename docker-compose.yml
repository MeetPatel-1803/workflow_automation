x-api-build: &api-build
  context: .
  dockerfile: Dockerfile
  target: runtime

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  # Inside the compose network the services are reachable by service name.
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration job: `docker compose up` runs it before the API starts.
  migrate:
    build: *api-build
    image: workflow-api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment: *api-env
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    image: workflow-api
    restart: unless-stopped
    environment: *api-env
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Same image as `api`, different command: a genuinely separate process
  # that pulls jobs off the `workflow-execution` BullMQ queue and runs step
  # logic (src/worker.ts) — the API process never executes a step itself,
  # only enqueues. Scale independently of `api` with
  # `docker compose up --scale worker=3`.
  worker:
    build: *api-build
    image: workflow-api
    command: ['node', 'dist/worker']
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ---- test profile: disposable DB for e2e tests (not started by plain `up`) ----
  # docker compose --profile test up -d postgres-test redis
  postgres-test:
    profiles: ['test']
    image: postgres:16
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow_test
    ports:
      - '5435:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workflow -d workflow_test']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
